# Reusable, credential-free frontend CI. Consumers opt in explicitly.
# No Cloudflare account tokens or deployment privileges are used here.
name: Frontend / Workers checks

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the frontend
        type: string
        default: '24'
      pnpm-version:
        description: pnpm version that matches the consumer lockfile
        type: string
        default: '10'
      run-format:
        description: Run pnpm format:check
        type: boolean
        default: false
      run-browser-tests:
        description: Install Chromium and run pnpm test
        type: boolean
        default: false
      check-cloudflare:
        description: Run cf deploy --dry-run after the project is fully configured
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: validate frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        if: inputs.run-format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Cloudflare configuration preflight
        if: inputs.check-cloudflare
        run: |
          test -f cloudflare.config.ts || { echo 'Missing committed cloudflare.config.ts' >&2; exit 1; }
          node -e "const p=require('./package.json'); if (!p.devDependencies?.cf && !p.dependencies?.cf) { console.error('Pin cf in package.json and lockfile first'); process.exit(1) }"
          CF_SEND_TELEMETRY=false pnpm exec cf deploy --dry-run
      - name: Install browser test dependency
        if: inputs.run-browser-tests
        run: pnpm test:browser:install
      - name: Browser tests
        if: inputs.run-browser-tests
        run: pnpm test
