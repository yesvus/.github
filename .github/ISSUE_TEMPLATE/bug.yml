name: Bug report
description: Report unexpected or incorrect behavior
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and evidence
      description: Include minimal steps and redacted logs or screenshots, if available. Never include secrets or personal data.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, platform or other relevant context, if known.
